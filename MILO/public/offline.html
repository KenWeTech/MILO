<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MILO - Offline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-glow { animation: pulse-ring 2.5s infinite ease-in-out; }
    </style>
</head>
<body class="bg-[#000000] text-[#f1f2f6] min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <div class="bg-[#000012] border border-[#216281] p-8 rounded-2xl shadow-2xl w-full max-w-md text-center flex flex-col items-center">

        <button onclick="checkConnection()" class="group focus:outline-none relative flex flex-col items-center transition-transform active:scale-95 mb-4" title="Click to reconnect">
            <div class="relative">
                <img src="/assets/logo.png" alt="MILO Logo" class="w-48 h-48 object-contain pulse-glow group-hover:brightness-125 transition-all">
            </div>
            <span class="text-xs font-semibold text-[#00BBFC] tracking-wider uppercase mt-2 group-hover:underline flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Tap Logo to Reconnect
            </span>
        </button>

        <h2 class="text-xl font-bold text-[#ffffff] mb-2">You are Offline</h2>
        <p id="status-message" class="text-sm text-[#b4b7c5] max-w-xs leading-relaxed mb-6">
            MILO cannot connect to the server right now. Check your network or tap the logo above to refresh.
        </p>

        <div class="w-full bg-[#000000] border border-[#2a2e43] py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 text-xs text-[#7a7d90]">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-[#ff80a8]"></span>
            <span id="status-text">Disconnected from MILO Web Server</span>
        </div>
    </div>

    <script>
        async function checkConnection() {
            const textEl = document.getElementById('status-text');
            const msgEl = document.getElementById('status-message');
            const dotEl = document.getElementById('status-dot');

            textEl.innerText = "Testing connection...";
            dotEl.className = "w-2 h-2 rounded-full bg-[#00BBFC] animate-ping";

            try {

                const res = await fetch('/?ping=' + new Date().getTime(), { method: 'HEAD', cache: 'no-store' });
                if (res.ok || res.status < 500) {
                    textEl.innerText = "Connected! Reloading...";
                    dotEl.className = "w-2 h-2 rounded-full bg-[#2EA8FF]";
                    window.location.href = '/';
                    return;
                }
            } catch (err) {

            }

            setTimeout(() => {
                textEl.innerText = "Still Offline";
                msgEl.innerText = "Server is still unreachable. Make sure you are connected to the network.";
                dotEl.className = "w-2 h-2 rounded-full bg-[#ff80a8]";
            }, 800);
        }

        window.addEventListener('online', () => {
            checkConnection();
        });
    </script>
</body>
</html>
